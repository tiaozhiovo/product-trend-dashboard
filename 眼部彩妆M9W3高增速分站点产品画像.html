var state = { site: SITES[0].name, cat: '', sort: 'desc' };

// 叶子类目全量收集
var allCats = [];
SITES.forEach(function(s){ s.groups.forEach(function(g){ if(allCats.indexOf(g.cat)<0) allCats.push(g.cat); }); });

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtRatio(r){ return (r*100).toFixed(1); }

// 水印
(function(){
  var wm = document.getElementById('wm');
  var text = '眼部彩妆M9W3高增速选品参考｜欢迎联系迢之 VX：tiaozhiovo';
  var count = 22;
  var html = '';
  for(var i=0;i<count;i++){
    var x = (i*97)%120 - 20;
    var y = i*140 + 20;
    html += '<div class="wm-line" style="left:'+x+'%;top:'+(y%1600)+'px">'+esc(text)+'</div>';
  }
  wm.innerHTML = html;
})();

// 站点 tabs
function renderTabs(){
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  SITES.forEach(function(s){
    var b = document.createElement('button');
    b.className = 'tab' + (s.name===state.site ? ' active':'');
    b.innerHTML = esc(s.name) + ' <span class="cnt">'+s.count+'</span>';
    b.onclick = function(){ state.site = s.name; render(); };
    el.appendChild(b);
  });
  // meta
  SITES.forEach(function(s){
    var id = 'm-'+s.name.replace('美国','us').replace('中东拉美澳新','mela').replace('欧区','eu');
    var elm = document.getElementById(id);
    if(elm) elm.textContent = s.count;
  });
}

// 类目下拉
function renderCatSelect(){
  var sel = document.getElementById('catFilter');
  var cur = state.cat;
  sel.innerHTML = '<option value="">全部叶子类目</option>';
  allCats.forEach(function(c){
    var o = document.createElement('option');
    o.value = c; o.textContent = c.split(',').pop();
    if(c===cur) o.selected = true;
    sel.appendChild(o);
  });
}

function currentGroups(){
  var s = SITES.find(function(x){ return x.name===state.site; });
  if(!s) return [];
  if(state.cat){
    return s.groups.filter(function(g){ return g.cat===state.cat; });
  }
  return s.groups;
}

function render(){
  renderTabs();
  var main = document.getElementById('main');
  var groups = currentGroups();
  var html = '';
  var total = 0;
  groups.forEach(function(g){
    var items = g.items.slice();
    if(state.sort==='asc') items.sort(function(a,b){ return a.ratio-b.ratio; });
    total += items.length;
    var cards = '';
    items.forEach(function(it, idx){
      var badge = '<span class="badge green"><span class="up">↑</span>'+fmtRatio(it.ratio)+'%</span>';
      cards += '<div class="card" data-u="'+esc(it.url)+'" data-cat="'+esc(g.short)+'" data-hier="'+esc(g.hier)+'" data-r="'+fmtRatio(it.ratio)+'">'
        + '<div class="imgbox"><img loading="lazy" src="'+esc(it.url)+'" alt="'+esc(g.short)+'" referrerpolicy="no-referrer"></div>'
        + '<div class="body"><div class="cat">'+esc(g.short)+'</div>'
        + '<div class="row">'+badge+'<span class="rank">第'+ (idx+1) +'名</span></div></div></div>';
    });
    html += '<div class="sec-title"><h2><span class="ico">◆</span>'+esc(g.short)+'<span style="font-size:14px;color:var(--muted);margin-left:10px;font-weight:600">'+items.length+' 款</span></h2>'
      + '<div class="sub">'+esc(g.hier)+'</div></div>';
    html += '<div class="grid">'+cards+'</div>';
  });
  if(total===0) html = '<div class="empty">当前筛选条件下暂无高增速商品。</div>';
  main.innerHTML = html;
  document.getElementById('rangeInfo').textContent = '当前站点共 '+total+' 款高增速商品';
  bindCards();
}

function bindCards(){
  var cards = document.querySelectorAll('.card');
  cards.forEach(function(c){
    c.onclick = function(){ openLb(c.getAttribute('data-u'), c.getAttribute('data-cat'), c.getAttribute('data-hier'), c.getAttribute('data-r')); };
  });
}

var lb = document.getElementById('lb');
function openLb(url, cat, hier, r){
  document.getElementById('lbImg').src = url;
  document.getElementById('lbCat').textContent = cat + ' · 环比 +'+r+'%';
  document.getElementById('lbSub').textContent = hier;
  document.getElementById('lbOpen').href = url;
  lb.classList.add('show');
}
function closeLb(){ lb.classList.remove('show'); }
document.getElementById('lbClose').onclick = closeLb;
document.getElementById('lbClose2').onclick = closeLb;
lb.addEventListener('click', function(e){ if(e.target===lb) closeLb(); });
document.getElementById('lbCopy').onclick = function(){
  var url = document.getElementById('lbImg').src;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){ alert('已复制图片链接'); }, function(){ prompt('复制失败，请手动复制：', url); });
  } else {
    prompt('复制失败，请手动复制：', url);
  }
};

// 回到顶部
var toTop = document.getElementById('toTop');
window.addEventListener('scroll', function(){
  if(window.scrollY>400){ toTop.classList.add('show'); } else { toTop.classList.remove('show'); }
});
toTop.onclick = function(){ window.scrollTo({top:0, behavior:'smooth'}); };

// 控件
document.getElementById('catFilter').onchange = function(){ state.cat = this.value; render(); };
document.getElementById('sortSel').onchange = function(){ state.sort = this.value; render(); };

// 初始化
renderCatSelect();
render();
</script>
